name: Android Debug Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already has an Android SDK at
      # /usr/local/lib/android/sdk with cmdline-tools on PATH.
      # android-actions/setup-android@v3 fails here: it runs
      # `sdkmanager tools`, and the legacy "tools" package no longer
      # exists, so sdkmanager exits 1. Install only what is missing.
      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses || true
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperFiles-debug
          path: app/build/outputs/apk/debug/app-debug.apk
